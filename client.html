<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>La Polla Chilena</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;700;900&family=Archivo+Narrow:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:        #f4f1ea;   /* warm bone */
  --bg-card:   #ffffff;
  --bg-raised: #ebe7dd;
  --border:    rgba(20,30,50,0.12);
  --text:      #1a2233;
  --text-mut:  #5a6577;
  --text-faint:#96a0b0;
  --rojo:      #d62839;   /* la roja */
  --rojo-soft: rgba(214,40,57,0.10);
  --cobre:     #b5651d;   /* Chilean copper — points & trophies */
  --cobre-soft:rgba(181,101,29,0.12);
  --verde:     #1a7f4b;
  --verde-soft:rgba(26,127,75,0.12);
  --mal:       #c0392b;
  --mal-soft:  rgba(192,57,43,0.08);
  --azul:      #2c6bb0;
}
*{margin:0;padding:0;box-sizing:border-box;}
html{-webkit-text-size-adjust:100%;}
body{
  background:var(--bg); color:var(--text);
  font-family:'Archivo Narrow', -apple-system, 'Segoe UI', Roboto, sans-serif;
  font-size:16px; min-height:100vh;
}
h1,h2,h3,.brand{ font-family:'Archivo', sans-serif; }
button{ font-family:inherit; }
input,select{
  font-family:inherit; background:var(--bg); color:var(--text);
  border:1px solid var(--border); border-radius:0.5rem; padding:0.5rem 0.7rem; font-size:1rem;
}
input:focus,select:focus{ outline:2px solid var(--rojo); outline-offset:1px; border-color:transparent; }
input[type=number]{ -moz-appearance:textfield; text-align:center; }
input[type=number]::-webkit-outer-spin-button, input[type=number]::-webkit-inner-spin-button{ -webkit-appearance:none; margin:0; }
::placeholder{ color:var(--text-faint); }
@keyframes pulse{ 0%,100%{opacity:1} 50%{opacity:0.35} }
@media (prefers-reduced-motion: reduce){ *{animation:none !important; transition:none !important;} }

/* Header */
.hdr{ position:sticky; top:0; z-index:50; background:rgba(244,241,234,0.92); backdrop-filter:blur(8px);
  border-bottom:1px solid var(--border); }
.hdr-in{ max-width:1100px; margin:0 auto; padding:0.65rem 1rem; display:flex; align-items:center; gap:0.75rem; flex-wrap:wrap; }
.brand{ font-weight:900; font-size:1.15rem; letter-spacing:-0.01em; color:var(--rojo); white-space:nowrap; }
.brand .star{ color:#fff; font-size:0.8em; vertical-align:0.15em; }
.tabs{ display:flex; gap:0.25rem; flex-wrap:wrap; }
.tab{ padding:0.4rem 0.85rem; border-radius:0.55rem; font-size:0.88rem; cursor:pointer;
  border:1px solid transparent; background:transparent; color:var(--text-mut); font-weight:600; }
.tab.on{ background:var(--rojo); color:#fff; }
.tab:not(.on):hover{ background:var(--bg-raised); color:var(--text); }
.hdr-user{ margin-left:auto; display:flex; align-items:center; gap:0.5rem; font-size:0.85rem; color:var(--text-mut); }
.btn{ padding:0.45rem 0.95rem; border-radius:0.55rem; border:1px solid var(--border); cursor:pointer;
  background:var(--bg-raised); color:var(--text); font-size:0.88rem; font-weight:600; }
.btn:hover{ border-color:var(--rojo); }
.btn.primary{ background:var(--rojo); border-color:var(--rojo); color:#fff; }
.btn.small{ padding:0.25rem 0.6rem; font-size:0.78rem; }
.btn:disabled{ opacity:0.45; cursor:not-allowed; }

.wrap{ max-width:1100px; margin:0 auto; padding:1rem; padding-bottom:4rem; }
.card{ background:var(--bg-card); border:1px solid var(--border); border-radius:0.85rem; padding:1rem; }
.muted{ color:var(--text-mut); } .faint{ color:var(--text-faint); }

/* Fecha navigator: ‹ Fecha N › + dropdown */
.fecha-nav{ display:flex; align-items:center; gap:0.5rem; margin-bottom:0.9rem; flex-wrap:wrap; }
.fecha-nav .arrow{ width:2.2rem; height:2.2rem; border-radius:0.5rem; border:1px solid var(--border);
  background:var(--bg-card); color:var(--text); font-size:1.1rem; cursor:pointer; display:flex;
  align-items:center; justify-content:center; }
.fecha-nav .arrow:hover:not(:disabled){ border-color:var(--rojo); color:var(--rojo); }
.fecha-nav .arrow:disabled{ opacity:0.35; cursor:not-allowed; }
.fecha-nav select{ font-weight:700; font-family:'Archivo',sans-serif; font-size:1rem; padding:0.5rem 0.8rem;
  background:var(--bg-card); cursor:pointer; min-width:9rem; }
.fecha-nav .status-tag{ font-size:0.72rem; padding:0.15rem 0.5rem; border-radius:999px; font-weight:700; }
.tag-live{ background:var(--mal-soft); color:var(--mal); }
.tag-done{ background:var(--verde-soft); color:var(--verde); }
.tag-next{ background:var(--rojo-soft); color:var(--rojo); }

/* Fixture rows (predict) */
.fx{ background:var(--bg-card); border:1px solid var(--border); border-radius:0.75rem;
  padding:0.7rem 0.9rem; margin-bottom:0.5rem; display:flex; align-items:center; gap:0.6rem; flex-wrap:wrap; }
.fx .teams{ flex:1; min-width:0; display:flex; align-items:center; gap:0.5rem; justify-content:center; }
.fx .team{ font-weight:600; font-size:0.95rem; flex:1; display:flex; align-items:center; gap:0.4rem; }
.fx .team.h{ justify-content:flex-end; text-align:right; } .fx .team.a{ justify-content:flex-start; text-align:left; }
.badge{ width:1.5rem; height:1.5rem; object-fit:contain; vertical-align:middle; flex-shrink:0; }
.pred-live{ display:flex; flex-direction:column; align-items:center; line-height:1.2; }
.pred-live .pred-mine{ font-size:0.7rem; color:var(--text-faint); font-family:'Archivo Narrow',sans-serif; }
.fx.live-fx{ border-color:rgba(214,40,57,0.4); background:rgba(214,40,57,0.04); }
.today-row{ display:flex; align-items:center; gap:0.5rem; padding:0.4rem 0.3rem; border-bottom:1px solid var(--border); }
.today-row:last-child{ border-bottom:none; }
.today-row.live-fx{ background:rgba(214,40,57,0.05); border-radius:0.4rem; }
.today-team{ flex:1; display:flex; align-items:center; gap:0.35rem; font-size:0.9rem; font-weight:600; }
.today-team.h{ justify-content:flex-end; text-align:right; }
.today-team.a{ justify-content:flex-start; }
.today-score{ min-width:5.5rem; text-align:center; white-space:nowrap; }
.fx .when{ width:7.5rem; display:flex; flex-direction:column; line-height:1.25; }
.fx .when .d{ font-size:0.86rem; color:var(--text-mut); font-weight:600; text-transform:capitalize; }
.fx .when .t{ font-size:1rem; color:var(--text); font-weight:700; font-family:ui-monospace,monospace; }
.fx .when .sus{ font-size:0.86rem; color:var(--text-faint); }
.fx input{ width:2.9rem; padding:0.4rem 0.2rem; font-weight:700; }
.fx.locked{ opacity:0.85; }
.fx .lock{ font-size:0.7rem; color:var(--text-faint); }
.saved-dot{ color:var(--verde); font-size:0.75rem; }

/* Results table */
.res-scroll{ overflow-x:auto; border:1px solid var(--border); border-radius:0.75rem; }
table.res{ border-collapse:collapse; width:max-content; min-width:100%; font-size:0.85rem; }
table.res th, table.res td{ padding:0.5rem 0.55rem; border-bottom:1px solid var(--border); }
table.res th{ background:var(--bg-raised); text-align:center; font-size:0.8rem; color:var(--text-mut);
  position:sticky; top:0; }
.match-cell .teams-line{ font-size:0.95rem; font-weight:600; color:var(--text); line-height:1.3; }
.match-cell .when-line{ font-size:0.82rem; color:var(--text-mut); margin-top:0.1rem; }
.score-col{ text-align:center; white-space:nowrap; min-width:5rem; }
.score-final{ font-size:1.15rem; font-weight:800; color:var(--cobre); font-family:ui-monospace,monospace; }
.ft-tag{ font-size:0.66rem; color:var(--text-faint); text-transform:uppercase; letter-spacing:0.05em; }
tr.live-row td{ background:rgba(214,40,57,0.05); }
table.res th:first-child, table.res td:first-child{ position:sticky; left:0; background:var(--bg-card);
  text-align:left; min-width:11rem; z-index:2; }
table.res th:first-child{ background:var(--bg-raised); z-index:3; }
td.pick{ text-align:center; font-family:ui-monospace, monospace; font-weight:600; white-space:nowrap; }
.p-exact{ background:var(--verde-soft); color:var(--verde); }
.p-good { background:var(--verde-soft); color:var(--verde); }
.p-bad  { background:var(--mal-soft);  color:var(--mal); }
.p-miss { color:var(--text-faint); font-style:italic; }
.p-wait { color:var(--text-faint); }
.livepill{ color:var(--mal); font-weight:800; font-size:1.15rem; font-family:ui-monospace,monospace; line-height:1.2; }
.livepill .dot{ animation:pulse 1.2s infinite; font-size:0.6rem; vertical-align:middle; }
tr.fecha-sep td{ background:var(--bg); color:var(--cobre); font-weight:700; font-size:0.72rem;
  text-transform:uppercase; letter-spacing:0.07em; }

/* Leaderboard */
.fecha-strip{ display:flex; flex-wrap:wrap; gap:0.4rem; padding:0.15rem 0 0.7rem; }
.fecha-win{ background:var(--cobre-soft); border:1px solid rgba(199,123,63,0.4);
  border-radius:0.6rem; padding:0.3rem 0.6rem; font-size:0.75rem; white-space:nowrap; }
.fecha-win b{ color:var(--cobre); }
.fecha-strip-wrap{ margin-bottom:0.5rem; }
.fecha-strip-wrap summary{ cursor:pointer; font-size:0.8rem; color:var(--cobre); font-weight:700;
  padding:0.3rem 0; user-select:none; }
table.lb{ border-collapse:collapse; width:100%; font-size:0.92rem; }
table.lb th, table.lb td{ padding:0.6rem 0.55rem; border-bottom:1px solid var(--border); }
table.lb th{ text-align:right; font-size:0.72rem; color:var(--text-mut); text-transform:uppercase; letter-spacing:0.05em; }
table.lb th:nth-child(2), table.lb td:nth-child(2){ text-align:left; }
table.lb td{ text-align:right; }
table.lb td.rank{ text-align:center; width:2.4rem; color:var(--text-mut); }
td.total{ color:var(--cobre); font-weight:800; font-size:1.05rem; }
.trofeos{ color:var(--cobre); letter-spacing:0.05em; }

/* Auth overlay */
.auth-ov{ position:fixed; inset:0; z-index:100; background:var(--bg);
  display:flex; align-items:center; justify-content:center; padding:1rem; }
.auth-box{ width:100%; max-width:23rem; }
.auth-box .brand{ font-size:1.9rem; display:block; text-align:center; margin-bottom:0.2rem; }
.auth-sub{ text-align:center; color:var(--text-faint); font-size:0.85rem; margin-bottom:1.4rem; }
.auth-box .card{ display:flex; flex-direction:column; gap:0.65rem; }
.auth-box input{ width:100%; }
.auth-links{ display:flex; justify-content:space-between; font-size:0.8rem; margin-top:0.2rem; }
.auth-links a{ color:var(--azul); cursor:pointer; text-decoration:none; }
.err{ color:var(--mal); font-size:0.83rem; }
.recovery-code{ background:var(--bg); border:1px dashed var(--cobre); border-radius:0.6rem;
  padding:0.8rem; text-align:center; font-family:ui-monospace,monospace; font-size:1.25rem;
  letter-spacing:0.12em; color:var(--cobre); user-select:all; }

/* Admin */
.admin-sec{ margin-bottom:0.75rem; }
.admin-sec summary{ cursor:pointer; font-weight:700; padding:0.75rem 1rem; user-select:none; }
.admin-sec[open] summary{ border-bottom:1px solid var(--border); }
.admin-body{ padding:0.9rem 1rem; display:flex; flex-direction:column; gap:0.6rem; }
.row{ display:flex; gap:0.5rem; flex-wrap:wrap; align-items:center; }
.score-grid{ display:grid; grid-template-columns:repeat(2,1fr); gap:0.5rem 1rem; }
.score-grid label{ display:flex; align-items:center; justify-content:space-between; gap:0.5rem;
  font-size:0.88rem; color:var(--text-mut); background:var(--bg); border:1px solid var(--border);
  border-radius:0.5rem; padding:0.45rem 0.7rem; }
.score-grid input{ width:4rem; flex-shrink:0; }
@media (max-width:640px){ .score-grid{ grid-template-columns:1fr; } }

.toast{ position:fixed; bottom:1.2rem; left:50%; transform:translateX(-50%); z-index:200;
  background:var(--bg-raised); border:1px solid var(--border); border-radius:0.6rem;
  padding:0.6rem 1.1rem; font-size:0.88rem; box-shadow:0 8px 30px rgba(0,0,0,0.5); }

@media (max-width:640px){
  .fx .when{ width:100%; order:-1; }
  table.res th:first-child, table.res td:first-child{ width:6.5rem; max-width:6.5rem; min-width:6.5rem; font-size:0.76rem; }
  .match-cell .teams-line{ font-size:0.8rem; line-height:1.2; white-space:normal; overflow-wrap:anywhere; }
  .match-cell .when-line{ font-size:0.72rem; }
  table.res th, table.res td{ padding:0.4rem 0.35rem; font-size:0.78rem; }
  table.lb th, table.lb td{ padding:0.5rem 0.35rem; font-size:0.83rem; }
  .badge{ width:1.1rem; height:1.1rem; }
}
</style>
</head>
<body>
<div id="update-banner" style="display:none;position:fixed;top:0;left:0;right:0;z-index:200;background:var(--verde);color:#fff;text-align:center;font-size:0.82rem;font-weight:700;padding:0.5rem;cursor:pointer;" onclick="location.reload(true)">🔄 Hay una nueva versión disponible — toca para actualizar</div>
<div id="conn-banner" style="display:none;position:fixed;bottom:0;left:0;right:0;z-index:190;background:var(--cobre);color:#fff;text-align:center;font-size:0.76rem;font-weight:600;padding:0.35rem 0.5rem;pointer-events:none;"></div>
<div id="app"></div>
<script>
// Build version — the server injects a hash at APP_VERSION below.
// When served statically/locally the placeholder stays intact and version
// checks are skipped.
const APP_VERSION = '__APP_VERSION__';

// ─────────────────────────────────────────────────────────────
// State
// ─────────────────────────────────────────────────────────────
const S = {
  token: localStorage.getItem('lpc_token') || '',
  name:  localStorage.getItem('lpc_name')  || '',
  isAdmin: localStorage.getItem('lpc_admin') === '1',
  tab: 'predict',            // predict | results | leaderboard | admin
  round: null,               // selected fecha in predict/results
  resRound: null,
  users: [], fixtures: [], adminFixtures: [], myPreds: {}, otherPreds: {}, live: {}, settings: {},
  loaded: false,   // true once the first WebSocket snapshot has arrived
  authView: 'login',         // login | register | forgot | showRecovery
  authErr: '', recoveryCode: '',
  connected: false,
  saveState: {},             // fixtureId -> 'saving' | 'saved'
};
const $ = sel => document.querySelector(sel);
const esc = s => String(s??'').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

function toast(msg){
  const t = document.createElement('div');
  t.className='toast'; t.textContent=msg;
  document.body.appendChild(t);
  setTimeout(()=>t.remove(), 2600);
}

// ─────────────────────────────────────────────────────────────
// API + WebSocket
// ─────────────────────────────────────────────────────────────
function authHeaders(){ return S.token ? { 'Authorization':'Bearer '+S.token, 'Content-Type':'application/json' } : { 'Content-Type':'application/json' }; }
async function api(method, url, body){
  const r = await fetch(url, { method, headers: authHeaders(), body: body!==undefined?JSON.stringify(body):undefined });
  const data = await r.json().catch(()=>({}));
  if(!r.ok) throw new Error(data.error || 'Error de red');
  return data;
}

// ── Connection + update banners ──────────────────────────────
function showConnBanner(msg){
  const el = document.getElementById('conn-banner');
  if(el){ el.textContent = msg||''; el.style.display = msg ? 'block' : 'none'; }
}
let _updateNudged = false;
function checkVersion(data){
  // Prompt to reload when the server is running a newer build than this tab.
  if(_updateNudged || !data || !data.serverVersion) return;
  if(APP_VERSION === '__APP_VERSION__') return; // served statically, no injection
  if(data.serverVersion === APP_VERSION) return;
  _updateNudged = true;
  const el = document.getElementById('update-banner');
  if(el) el.style.display = 'block';
}

let ws = null, wsRetry = null, _everConnected = false;
function connectWS(){
  if(!S.token) return;
  clearTimeout(wsRetry);
  if(ws){
    // Detach handlers so a late message or close from the old socket can't
    // repopulate state or trigger a stray reconnect when switching accounts.
    try{ ws.onopen = ws.onmessage = ws.onclose = ws.onerror = null; ws.close(); }catch(e){}
    ws = null;
  }
  const proto = location.protocol==='https:'?'wss':'ws';
  // Show "updating" only on a reconnect (not the very first connect)
  if(_everConnected) showConnBanner('⟳ Actualizando…');
  const sock = new WebSocket(`${proto}://${location.host}/ws?token=${encodeURIComponent(S.token)}`);
  ws = sock;
  sock.onopen = () => { S.connected = true; _everConnected = true; showConnBanner(''); };
  sock.onmessage = ev => {
    if(ws !== sock) return; // ignore messages from a superseded socket
    try{
      const msg = JSON.parse(ev.data);
      if(msg.type==='state'){
        checkVersion(msg.data);
        S.loaded = true;
        Object.assign(S, {
          users: msg.data.users, fixtures: msg.data.fixtures,
          adminFixtures: msg.data.adminFixtures || msg.data.fixtures,
          myPreds: msg.data.myPreds, otherPreds: msg.data.otherPreds,
          live: msg.data.live, settings: msg.data.settings,
        });
        render();
      }
    }catch(e){}
  };
  sock.onclose = ev => {
    if(ws !== sock) return; // a superseded socket closing — ignore
    S.connected = false;
    if(ev.code===4001){ logoutLocal(); render(); return; }
    showConnBanner('⚠ Sin conexión — reconectando…');
    clearTimeout(wsRetry); wsRetry = setTimeout(connectWS, 3000);
  };
}
function resetDataState(){
  // Clear everything tied to a session so data never leaks between accounts
  // in the same tab (e.g. registering a test user after entering your picks).
  S.users=[]; S.fixtures=[]; S.adminFixtures=[];
  S.myPreds={}; S.otherPreds={}; S.live={}; S.settings={};
  S.loaded=false; S.saveState={};
  S.round=null; S.resRound=null;
}
function logoutLocal(){
  S.token=''; S.name=''; S.isAdmin=false;
  localStorage.removeItem('lpc_token'); localStorage.removeItem('lpc_name'); localStorage.removeItem('lpc_admin');
  resetDataState();
}

// ─────────────────────────────────────────────────────────────
// Scoring (client copy — leaderboard, results coloring)
// 5 exacto, 3 resultado, 0 malo. -1 olvido. +1 ganador de la fecha.
// ─────────────────────────────────────────────────────────────
const outcome = (h,a) => h>a?'H':a>h?'A':'D';
// Configurable point values (from server settings, with sensible fallbacks)
function scoringPts(){
  const s = S.settings || {};
  const n = (v,d)=>{ const x=parseFloat(v); return isNaN(x)?d:x; };
  return { exact:n(s.pts_exact,5), correct:n(s.pts_correct,3), miss:n(s.pts_miss,1), fecha:n(s.pts_fecha,1) };
}
function gamePoints(pred, fx){
  if(fx.status!=='finished' || fx.home_score==null) return null;
  if(!pred || pred.hs==null || pred.as==null) return null;
  const P = scoringPts();
  if(pred.hs===fx.home_score && pred.as===fx.away_score) return P.exact;
  return outcome(pred.hs,pred.as)===outcome(fx.home_score,fx.away_score) ? P.correct : 0;
}
// True if a game-points value counts as an exact score / correct result,
// independent of the configured point amounts.
function isExact(pred, fx){
  return fx.status==='finished' && fx.home_score!=null && pred && pred.hs!=null
    && pred.hs===fx.home_score && pred.as===fx.away_score;
}
function isCorrect(pred, fx){
  return fx.status==='finished' && fx.home_score!=null && pred && pred.hs!=null
    && outcome(pred.hs,pred.as)===outcome(fx.home_score,fx.away_score);
}
// Escudos de los equipos (estáticos, no cambian). Mapa nombre canónico -> URL.
// Vacío por defecto; llena estas URLs cuando las tengas (click derecho ->
// copiar dirección de imagen sobre el escudo, o desde TheSportsDB). Si un
// equipo no tiene URL aquí, simplemente no se muestra logo (no rompe nada).
const TEAM_BADGES = {
  'Audax Italiano': 'https://r2.thesportsdb.com/images/media/team/badge/xbowln1672950178.png/small',
  'Cobresal': 'https://r2.thesportsdb.com/images/media/team/badge/36tqoo1602187477.png/small',
  'Colo-Colo': 'https://r2.thesportsdb.com/images/media/team/badge/s41be31578347962.png/small',
  'Coquimbo Unido': 'https://r2.thesportsdb.com/images/media/team/badge/b2cnht1602186172.png/small',
  'Deportes Concepción': 'https://r2.thesportsdb.com/images/media/team/badge/bn8l9d1719394347.png/small',
  'Deportes La Serena': 'https://r2.thesportsdb.com/images/media/team/badge/vs7mxv1677600646.png/small',
  'Deportes Limache': 'https://r2.thesportsdb.com/images/media/team/badge/1bd0ws1706521384.png/small',
  'Everton de Viña del Mar': 'https://r2.thesportsdb.com/images/media/team/badge/3yo4ag1779074331.png/small',
  'Huachipato': 'https://r2.thesportsdb.com/images/media/team/badge/uhzow91736214236.png/small',
  'Ñublense': 'https://r2.thesportsdb.com/images/media/team/badge/0jpiwm1610649915.png/small',
  "O'Higgins": 'https://r2.thesportsdb.com/images/media/team/badge/g44b1l1756095484.png/small',
  'Palestino': 'https://r2.thesportsdb.com/images/media/team/badge/62site1756091114.png/small',
  'Unión La Calera': 'https://r2.thesportsdb.com/images/media/team/badge/vadt5t1769834071.png/small',
  'Universidad Católica': 'https://r2.thesportsdb.com/images/media/team/badge/h2pcuc1602188028.png/small',
  'Universidad de Chile': 'https://r2.thesportsdb.com/images/media/team/badge/po0o3c1578347873.png/small',
  'Universidad de Concepción': 'https://r2.thesportsdb.com/images/media/team/badge/fyj9u51602187758.png/small',
};

function fxStarted(fx){ return fx.kickoff && new Date(fx.kickoff).getTime() <= Date.now(); }
// Small team badge <img>, or empty string if we don't have one for this team
function teamBadge(name){
  const url = TEAM_BADGES[name];
  if(!url) return '';
  return ` <img class="badge" src="${esc(url)}" alt="" loading="lazy" onerror="this.style.display='none'">`;
}

function predsForUser(name){
  if(name===S.name) return S.myPreds;
  return S.otherPreds[name] || {};
}

// Returns a fixture view that scores as "finished" using the live score when a
// game is currently in progress. Used so the leaderboard reflects live results.
// Final results (status==='finished') take precedence over live.
function scoringFixture(fx){
  if(fx.status==='finished' && fx.home_score!=null) return fx;
  const lv = S.live[fx.id];
  if(lv && lv.hs!=null && lv.as!=null){
    return { ...fx, home_score:lv.hs, away_score:lv.as, status:'finished' };
  }
  return fx;
}
// Is this game currently live (has a live score and not final)?
function isLiveFx(fx){
  return fx.status!=='finished' && !!(S.live[fx.id] && S.live[fx.id].hs!=null);
}

// Complete rounds: every fixture in the round finished
function completedRounds(){
  const byRound = {};
  for(const f of S.fixtures){ if(f.round!=null){ (byRound[f.round]||(byRound[f.round]=[])).push(f); } }
  return Object.keys(byRound).map(Number)
    .filter(r => byRound[r].length>0 && byRound[r].every(f=>f.status==='finished'))
    .sort((a,b)=>a-b);
}

// Full leaderboard computation
function computeLeaderboard(){
  const comp = completedRounds();
  const P = scoringPts();
  let anyLive = false;
  const rows = S.users.map(u => {
    const preds = predsForUser(u.name);
    const joined = new Date(u.createdAt).getTime();
    let earned = 0, exact = 0, correct = 0, missed = 0;
    const roundPts = {}; // round -> pts
    for(const fx of S.fixtures){
      const p = preds[fx.id];
      const sfx = scoringFixture(fx);       // overlays live score if in progress
      if(isLiveFx(fx)) anyLive = true;
      const pts = gamePoints(p, sfx);
      if(pts!=null){
        earned += pts;
        if(isExact(p, sfx)) exact++;
        if(isCorrect(p, sfx)) correct++;
      }
      const miss = fxStarted(fx) && (!p || p.hs==null)
        && fx.kickoff && new Date(fx.kickoff).getTime() > joined
        && fx.status!=='postponed';
      if(miss){ earned -= P.miss; missed++; }
      if(fx.round!=null && comp.includes(fx.round)){
        roundPts[fx.round] = (roundPts[fx.round]||0) + (pts!=null?pts:0) - (miss?P.miss:0);
      }
    }
    return { name:u.name, baseline:u.baseline||0, earned, exact, correct, missed, roundPts, fechas:0 };
  });
  // Ganador de la fecha: bonus per complete round to max scorer(s)
  const fechaWinners = {}; // round -> [names]
  for(const r of comp){
    let max = -Infinity;
    for(const row of rows){ const s = row.roundPts[r]; if(s!=null && s>max) max = s; }
    if(max===-Infinity) continue;
    fechaWinners[r] = [];
    for(const row of rows){
      if(row.roundPts[r]===max){ row.fechas++; fechaWinners[r].push(row.name); }
    }
  }
  for(const row of rows) row.total = row.baseline + row.earned + row.fechas * P.fecha;
  // Tiebreakers: Total → Exactos → Resultados
  rows.sort((a,b) => b.total-a.total || b.exact-a.exact || b.correct-a.correct || a.name.localeCompare(b.name));
  // Shared ranks
  let rank=0, prev=null;
  rows.forEach((row,i) => {
    const key = `${row.total}|${row.exact}|${row.correct}`;
    if(key!==prev){ rank = i+1; prev = key; }
    row.rank = rank;
  });
  return { rows, fechaWinners, completed: comp, anyLive };
}

function bindAuth(){
  document.querySelectorAll('.auth-links a').forEach(a=>a.onclick=()=>{ S.authView=a.dataset.v; S.authErr=''; render(); });
  const done = $('#recoveryDone');
  if(done){ done.onclick = () => { S.authView='login'; S.recoveryCode=''; connectWS(); render(); }; return; }

        saveSession(r); S.recoveryCode = r.recoveryCode; S.authView='showRecovery'; render();

        const r = await api('POST','/api/reset-password',{ name, recoveryCode: $('#aCode')?.value, newPassword: pass });

      } else {
        const r = await api('POST','/api/login',{ name, password: pass });
        saveSession(r); connectWS(); render();

    }catch(e){ S.authErr = e.message; render(); }
  };

  document.querySelectorAll('.auth-box input').forEach(i=>i.onkeydown=e=>{ if(e.key==='Enter') go(); });

function saveSession(r){
  // Wipe any prior account's data before adopting the new session
  resetDataState();
  S.token=r.token; S.name=r.name; S.isAdmin=!!r.isAdmin;
  localStorage.setItem('lpc_token', r.token);
  localStorage.setItem('lpc_name', r.name);
  localStorage.setItem('lpc_admin', r.isAdmin?'1':'0');
}

// ── Shared helpers ───────────────────────────────────────────
function roundsList(){
  const rs = [...new Set(S.fixtures.filter(f=>f.round!=null).map(f=>f.round))].sort((a,b)=>a-b);
  return rs;
}
function currentRoundDefault(){
  // First round with an unstarted game, else last round
  const rs = roundsList();
  for(const r of rs){
    if(S.fixtures.some(f=>f.round===r && !fxStarted(f))) return r;
  }
  return rs[rs.length-1] ?? null;
}
function fmtWhen(iso){
  if(!iso) return 'por definir';
  const d = new Date(iso);
  return d.toLocaleDateString('es-CL',{weekday:'short',day:'numeric',month:'short'})
    + ' · ' + d.toLocaleTimeString('es-CL',{hour:'2-digit',minute:'2-digit',hour12:false});
}
function fmtDate(iso){
  if(!iso) return 'por definir';
  return new Date(iso).toLocaleDateString('es-CL',{weekday:'short',day:'numeric',month:'short'});
}
function fmtTime(iso){
  if(!iso) return '';
  return new Date(iso).toLocaleTimeString('es-CL',{hour:'2-digit',minute:'2-digit',hour12:false});
}
function roundStatus(r){
  const fxs = S.fixtures.filter(f=>f.round===r);
  if(!fxs.length) return 'next';
  if(fxs.some(f=>S.live[f.id])) return 'live';
  if(fxs.every(f=>f.status==='finished')) return 'done';
  if(fxs.some(f=>fxStarted(f))) return 'live';
  return 'next';
}
// Fecha navigator: ‹ [dropdown] › with a status tag. `onNav` receives the new round.
function fechaNav(sel, onNavName){
  const rs = roundsList();
  if(!rs.length) return '';
  const idx = rs.indexOf(sel);
  const st = roundStatus(sel);
  const tag = st==='live' ? '<span class="status-tag tag-live">en juego</span>'
            : st==='done' ? '<span class="status-tag tag-done">jugada</span>'
            : '<span class="status-tag tag-next">próxima</span>';
  const opts = rs.map(r=>{
    const s = roundStatus(r);
    const mark = s==='done'?'✓ ':s==='live'?'● ':'';
    return `<option value="${r}" ${r===sel?'selected':''}>${mark}Fecha ${r}</option>`;
  }).join('');
  return `<div class="fecha-nav">
    <button class="arrow" data-nav="prev" data-target="${onNavName}" ${idx<=0?'disabled':''}>‹</button>
    <select data-navsel="${onNavName}">${opts}</select>
    <button class="arrow" data-nav="next" data-target="${onNavName}" ${idx>=rs.length-1?'disabled':''}>›</button>
    ${tag}
  </div>`;
}
function bindFechaNav(getSel, setSel){
  document.querySelectorAll('[data-nav]').forEach(b=>b.onclick=()=>{
    const rs = roundsList(); const idx = rs.indexOf(getSel());
    const ni = b.dataset.nav==='prev' ? idx-1 : idx+1;
    if(ni>=0 && ni<rs.length){ setSel(rs[ni]); render(); }
  });
  document.querySelectorAll('[data-navsel]').forEach(s=>s.onchange=()=>{ setSel(parseInt(s.value,10)); render(); });
}

// ── Predict tab ──────────────────────────────────────────────
function renderPredict(){
  if(!S.fixtures.length){
    if(!S.loaded) return `<div class="card"><p class="muted">Cargando partidos…</p></div>`;
    return `<div class="card"><p class="muted">Aún no hay partidos cargados.${S.isAdmin?' Anda al Admin y sincroniza el fixture.':' El admin todavía no carga el fixture.'}</p></div>`;
  }
  if(S.round==null) S.round = currentRoundDefault();
  const fxs = S.fixtures.filter(f=>f.round===S.round)
    .sort((a,b)=>new Date(a.kickoff||0)-new Date(b.kickoff||0));
  const rows = fxs.map(fx=>{
    const locked = fxStarted(fx) || fx.status==='finished';
    const p = S.myPreds[fx.id] || {};
    const save = S.saveState[fx.id];
    const postponed = fx.status==='postponed';
    const live = S.live[fx.id];
    // Center block: live score, final score, or prediction inputs
    let center;
    if(!locked){
      center = `<input type="number" min="0" max="99" inputmode="numeric" data-fx="${fx.id}" data-side="h" value="${p.hs??''}">
             <span class="faint">–</span>
             <input type="number" min="0" max="99" inputmode="numeric" data-fx="${fx.id}" data-side="a" value="${p.as??''}">`;
    } else if(live){
      center = `<span class="pred-live"><span class="livepill" style="font-size:1.05rem;">${live.hs}–${live.as} <span class="dot">●</span></span>
             <span class="pred-mine">tú: ${p.hs!=null?`${p.hs}–${p.as}`:'–'}</span></span>`;
    } else if(fx.status==='finished'){
      center = `<span class="pred-live"><span style="font-family:ui-monospace,monospace;font-weight:800;color:var(--cobre);">${fx.home_score}–${fx.away_score}</span>
             <span class="pred-mine">tú: ${p.hs!=null?`${p.hs}–${p.as}`:'–'}</span></span>`;
    } else {
      center = `<span style="font-family:ui-monospace,monospace;font-weight:700;color:var(--text-mut);">${p.hs!=null?`${p.hs}–${p.as}`:'–'}</span>`;
    }
    return `<div class="fx ${locked?'locked':''} ${live?'live-fx':''}">
      <span class="when">${postponed
        ? '<span class="sus">⏸ suspendido</span>'
        : `<span class="d">${fmtDate(fx.kickoff)}</span><span class="t">${fmtTime(fx.kickoff)}</span>`}</span>
      <div class="teams">
        <span class="team h">${esc(fx.home)}${teamBadge(fx.home)}</span>
        ${center}
        <span class="team a">${teamBadge(fx.away)}${esc(fx.away)}</span>
      </div>
      ${live ? `<span class="livepill" style="font-size:0.68rem;">● EN VIVO</span>`
        : locked ? `<span class="lock">🔒</span>`
        : save==='saved' ? `<span class="saved-dot">✓ guardado</span>`
        : save==='saving' ? `<span class="faint" style="font-size:0.75rem;">…</span>` : ''}
    </div>`;
  }).join('');
  return `
    <h2 style="margin-bottom:0.6rem;font-size:1.05rem;">Predicciones</h2>
    <p class="faint" style="font-size:0.95rem;margin-bottom:0.75rem;">
      Puedes predecir cada partido hasta que comience. Si se te olvida uno: <b style="color:var(--mal);">−${scoringPts().miss} ${scoringPts().miss===1?'punto':'puntos'}</b>.
    </p>
    ${fechaNav(S.round, 'predict')}
    ${rows || '<div class="card muted">No hay partidos en esta fecha.</div>'}`;
}
const _saveTimers = {};
function bindPredict(){
  bindFechaNav(()=>S.round, r=>{ S.round=r; });
  document.querySelectorAll('.fx input[data-fx]').forEach(inp=>{
    inp.oninput = () => {
      const fid = inp.dataset.fx;
      clearTimeout(_saveTimers[fid]);
      S.saveState[fid]='saving';
      _saveTimers[fid] = setTimeout(async () => {
        const h = document.querySelector(`input[data-fx="${fid}"][data-side="h"]`)?.value;
        const a = document.querySelector(`input[data-fx="${fid}"][data-side="a"]`)?.value;
        // Update local state so re-render keeps values
        S.myPreds[fid] = { hs: h===''?null:parseInt(h,10), as: a===''?null:parseInt(a,10) };
        try{
          await api('PUT', `/api/predictions/${encodeURIComponent(fid)}`, { homeScore:h, awayScore:a });
          S.saveState[fid]='saved';
        }catch(e){ toast(e.message); delete S.saveState[fid]; }
        // Refresh just the save indicator without nuking focus: full render only if not typing
        if(document.activeElement?.dataset?.fx !== fid) render();
      }, 600);
    };
  });
}

function renderResults(){
  if(!S.fixtures.length) return `<div class="card muted">${S.loaded?'Aún no hay partidos cargados.':'Cargando partidos…'}</div>`;
  if(S.resRound==null) S.resRound = currentRoundDefault();
  const users = [...S.users].sort((a,b)=>a.name.localeCompare(b.name));
  const fxs = S.fixtures.filter(f=>f.round===S.resRound)
    .sort((a,b)=>new Date(a.kickoff||0)-new Date(b.kickoff||0));

  const head = `<tr><th>Partido</th><th class="score-col">Marcador</th>${users.map(u=>`<th>${esc(u.name)}</th>`).join('')}</tr>`;
  const body = fxs.map(fx=>{
    const live = S.live[fx.id];
    let scoreCell;
    if(live) scoreCell = `<span class="livepill">${live.hs}–${live.as}<br><span class="dot">●</span> ${esc(live.clock||'EN VIVO')}</span>`;
    else if(fx.status==='finished') scoreCell = `<span class="score-final">${fx.home_score}–${fx.away_score}</span><br><span class="ft-tag">Final</span>`;
    else if(fx.status==='postponed') scoreCell = `<span class="faint">susp.</span>`;
    else scoreCell = `<span class="faint">–</span>`;
    const compare = fx.status==='finished' && fx.home_score!=null
      ? { home_score: fx.home_score, away_score: fx.away_score, status:'finished' }
      : live ? { home_score: live.hs, away_score: live.as, status:'finished' } : null;
    const cells = users.map(u=>{
      const p = predsForUser(u.name)[fx.id];
      const started = fxStarted(fx);
      if(!started) return `<td class="pick p-wait">${u.name===S.name && p && p.hs!=null ? `${p.hs}–${p.as}` : '·'}</td>`;
      if(!p || p.hs==null){
        return fx.status==='postponed'
          ? `<td class="pick p-wait">–</td>`
          : `<td class="pick p-miss">−${scoringPts().miss}</td>`;
      }
      if(!compare) return `<td class="pick p-wait">${p.hs}–${p.as}</td>`;
      const pts = gamePoints(p, compare);
      const ex = isExact(p, compare), co = isCorrect(p, compare);
      const cls = ex?'p-exact':co?'p-good':'p-bad';
      return `<td class="pick ${cls}">${ex?'🎯 ':''}${p.hs}–${p.as}</td>`;
    }).join('');
    const whenLine = fx.status==='postponed' ? '<div class="when-line">suspendido</div>'
      : `<div class="when-line">${fmtDate(fx.kickoff)} · ${fmtTime(fx.kickoff)}</div>`;
    const liveRowCls = live ? ' class="live-row"' : '';
    return `<tr${liveRowCls}>
      <td class="match-cell">
        <div class="teams-line">${teamBadge(fx.home)}${esc(fx.home)} <span class="faint">v</span> ${esc(fx.away)}${teamBadge(fx.away)}</div>
        ${whenLine}
      </td>
      <td class="score-col">${scoreCell}</td>
      ${cells}</tr>`;
  }).join('');

  // Show the fecha winner for this round if it's complete (respects polla start via computeLeaderboard)
  const { fechaWinners, completed } = computeLeaderboard();
  const winnerBanner = completed.includes(S.resRound) && fechaWinners[S.resRound]?.length
    ? `<div class="fecha-win" style="display:inline-block;margin-bottom:0.75rem;font-size:0.9rem;">
         🏆 Ganador${fechaWinners[S.resRound].length>1?'es':''} de la Fecha ${S.resRound}:
         <b>${fechaWinners[S.resRound].map(esc).join(', ')}</b></div>`
    : '';

  return `
    <h2 style="margin-bottom:0.6rem;font-size:1.05rem;">Resultados</h2>
    ${fechaNav(S.resRound, 'results')}
    ${winnerBanner}
    <div class="res-scroll"><table class="res">${head}${body}</table></div>
    <p class="faint" style="font-size:0.9rem;margin-top:0.6rem;">
      🎯 verde = marcador exacto (${scoringPts().exact} pts) · verde = resultado correcto (${scoringPts().correct} pts) ·
      <span style="color:var(--mal);">rojo</span> = resultado equivocado ·
      <i>−${scoringPts().miss}</i> = no predijo · Los pronósticos de los demás se muestran cuando el partido comienza.
    </p>`;
}

  bindFechaNav(()=>S.resRound, r=>{ S.resRound=r; });

    else score = `<span class="faint" style="font-size:0.82rem;">${fmtTime(fx.kickoff)}</span>`;
    return `<div class="today-row ${live?'live-fx':''}">
      <span class="today-team h">${esc(fx.home)}${teamBadge(fx.home)}</span>
      <span class="today-score">${score}</span>
      <span class="today-team a">${teamBadge(fx.away)}${esc(fx.away)}</span>
    </div>`;
  }).join('');
  return `<div class="card" style="margin-bottom:0.9rem;padding:0.75rem 0.9rem;">
    <div style="font-size:0.78rem;font-weight:700;color:var(--text-mut);text-transform:uppercase;letter-spacing:0.05em;margin-bottom:0.5rem;">📅 Partidos de hoy</div>
    ${rows}
  </div>`;
}
function renderLeaderboard(){
  if(!S.users.length) return `<div class="card muted">${S.loaded?'Sin usuarios aún.':'Cargando…'}</div>`;
  const { rows, fechaWinners, completed, anyLive } = computeLeaderboard();
  // Fecha winners — most recent first. Collapsible so it never dominates the page.
  const winnerChips = [...completed].reverse().map(r=>
    `<div class="fecha-win">🏆 <b>F${r}</b> ${fechaWinners[r].map(esc).join(', ')}</div>`).join('');
  const strip = completed.length
    ? (completed.length > 6
        ? `<details class="fecha-strip-wrap"><summary>🏆 Ganadores de la fecha (${completed.length})</summary>
             <div class="fecha-strip">${winnerChips}</div></details>`
        : `<div class="fecha-strip-wrap"><div class="fecha-strip">${winnerChips}</div></div>`)
    : '';
  const body = rows.map(e=>{
    const medal = e.rank===1?'🥇':e.rank===2?'🥈':e.rank===3?'🥉':e.rank;
    return `<tr>
      <td class="rank">${medal}</td>
      <td style="font-weight:600;">${esc(e.name)}${e.baseline?` <span class="faint" title="Comenzó con ${e.baseline} pts (regla del que llega tarde)" style="font-size:0.7rem;">+${e.baseline}</span>`:''}</td>
      <td class="total">${e.total}</td>
      <td style="color:var(--verde);">${e.exact}</td>
      <td class="muted">${e.correct}</td>
      <td style="color:${e.missed?'var(--mal)':'var(--text-faint)'};">${e.missed||'–'}</td>
      <td class="trofeos">${e.fechas ? '🏆'.repeat(Math.min(e.fechas,8)) + (e.fechas>8?` ×${e.fechas}`:'') : '–'}</td>
    </tr>`;
  }).join('');
  return `
    <h2 style="margin-bottom:0.6rem;font-size:1.05rem;">Tabla general ${anyLive?'<span class="livepill" style="font-size:0.7rem;">● EN VIVO</span>':''}</h2>
    ${todaysGamesPanel()}
    ${anyLive?'<p class="faint" style="font-size:0.8rem;margin-bottom:0.6rem;">La tabla incluye los marcadores en vivo. El bono de ganador de la fecha se otorga solo cuando termina la fecha.</p>':''}
    ${strip}
    <div class="card" style="padding:0;overflow-x:auto;">
      <table class="lb">
        <tr><th>#</th><th>Nombre</th><th title="Puntos totales (incluye bonos de fecha y −1 por olvidos)">Total</th>
          <th title="Marcadores exactos — primer desempate">Exactos</th>
          <th title="Resultados correctos (incluye exactos) — segundo desempate">Result.</th>
          <th title="Partidos sin pronóstico (−1 c/u)">Olvidos</th>
          <th title="Fechas ganadas (+1 punto cada una, puede haber empates)">Fechas</th></tr>
        ${body}
      </table>
    </div>
    <p class="faint" style="font-size:0.9rem;margin-top:0.6rem;">
      ${scoringPts().exact} pts marcador exacto · ${scoringPts().correct} pts resultado correcto · −${scoringPts().miss} por partido sin pronóstico ·
      +${scoringPts().fecha} al ganador de cada fecha (empates comparten ${scoringPts().fecha===1?'el punto':'los puntos'}) ·
      Desempates: Total → Exactos → Resultados.
    </p>`;
}

// ── Admin tab ────────────────────────────────────────────────
function renderAdmin(){
  const st = S.settings;
  const adminFx = S.adminFixtures || S.fixtures;
  const fxOptions = [...adminFx]
    .sort((a,b)=>new Date(a.kickoff||0)-new Date(b.kickoff||0))
    .map(f=>`<option value="${f.id}">F${f.round??'?'} · ${esc(f.home)} v ${esc(f.away)} (${f.status==='finished'?`${f.home_score}–${f.away_score}`:fmtWhen(f.kickoff)})</option>`).join('');
  // datetime-local value for polla_start
  const startLocal = st.polla_start
    ? new Date(new Date(st.polla_start).getTime()-new Date().getTimezoneOffset()*60000).toISOString().slice(0,16) : '';

      <summary>🎯 Puntaje</summary>
      <div class="admin-body">
        <p class="faint" style="font-size:0.82rem;">Ajusta cuánto vale cada acierto. Los cambios se aplican de inmediato a toda la tabla.</p>
        <div class="score-grid">
          <label>Marcador exacto <input id="setExact" type="number" min="0" max="100" step="0.5" value="${st.pts_exact??5}"></label>
          <label>Resultado correcto <input id="setCorrect" type="number" min="0" max="100" step="0.5" value="${st.pts_correct??3}"></label>
          <label>Penalización por no predecir <input id="setMiss" type="number" min="0" max="100" step="0.5" value="${st.pts_miss??1}"></label>
          <label>Ganador de la fecha <input id="setFecha" type="number" min="0" max="100" step="0.5" value="${st.pts_fecha??1}"></label>
        </div>
        <div class="row">
          <button class="btn primary" id="saveScoring">Guardar puntaje</button>
          <span class="faint" style="font-size:0.78rem;">La penalización se resta (ej. 1 = −1 por partido sin pronóstico).</span>
        </div>
      </div>
    </details>

    <details class="card admin-sec" open>
      <summary>📅 Inicio de la polla</summary>
      <div class="admin-body">
        <p class="faint" style="font-size:0.82rem;">Partidos anteriores a esta fecha/hora <b>no se muestran</b> y no dan ni quitan puntos. Déjalo vacío para incluir toda la temporada.</p>
        <div class="row">
          <input id="setStart" type="datetime-local" value="${startLocal}" style="width:14rem;">
          <button class="btn primary" id="saveStart">Guardar inicio</button>
          ${st.polla_start?`<button class="btn" id="clearStart">Quitar (incluir todo)</button>`:''}
        </div>
        <span class="faint" style="font-size:0.78rem;">Actual: ${st.polla_start?new Date(st.polla_start).toLocaleString('es-CL'):'sin definir (toda la temporada)'}</span>
      </div>
    </details>

    <details class="card admin-sec" open>
      <summary>📋 Importar fixture desde TheSportsDB (CSV)</summary>
      <div class="admin-body">
        <p class="faint" style="font-size:0.82rem;">En TheSportsDB, abre la temporada, usa el botón de exportar/copiar CSV y pega todo aquí (con o sin encabezado). Trae las 30 fechas, horas (en UTC) y los resultados de los partidos ya jugados. Re-importar actualiza horarios y resultados sin duplicar; nunca sobrescribe un resultado que hayas puesto a mano.</p>
        <textarea id="csvText" rows="6" placeholder='idEvent,strTimestamp,Round,Home Team,Home Score,Away Team,Away Score,...&#10;"2412916","2026-01-30 23:00:00","Round 1","Universidad de Chile","0","Audax Italiano","0",...' style="width:100%;font-family:ui-monospace,monospace;font-size:0.72rem;padding:0.6rem;background:var(--bg);border:1px solid var(--border);border-radius:0.5rem;color:var(--text);"></textarea>
        <div class="row">
          <button class="btn primary" id="csvSubmit">Importar CSV</button>
          <span class="faint" style="font-size:0.78rem;">Recomendado para cargar toda la temporada de una vez.</span>
        </div>
      </div>
    </details>

    <details class="card admin-sec">
      <summary>🔄 Sincronización (fixture + resultados + en vivo)</summary>
      <div class="admin-body">
        <div class="row">
          <label class="muted" style="font-size:0.85rem;">TheSportsDB league ID <input id="setLeague" value="${esc(st.tsdb_league_id||'')}" style="width:6rem;"></label>
          <label class="muted" style="font-size:0.85rem;">Temporada <input id="setSeason" value="${esc(st.tsdb_season||'')}" style="width:6rem;"></label>
          <label class="muted" style="font-size:0.85rem;">ESPN slug <input id="setEspn" value="${esc(st.espn_slug||'')}" style="width:6rem;"></label>
          <label class="muted" style="font-size:0.85rem;"><input type="checkbox" id="setSyncOn" ${st.sync_enabled==='true'?'checked':''}> Sync automático</label>
        </div>
        <div class="row">
          <button class="btn" id="saveSettings">Guardar configuración</button>
          <button class="btn primary" id="syncNow">Sincronizar fixture ahora</button>
          <button class="btn" id="debugBtn">🔍 Diagnóstico</button>
          <span class="faint" style="font-size:0.78rem;">Última sync: ${st.last_sync?new Date(st.last_sync).toLocaleString('es-CL'):'nunca'}</span>
        </div>
        <pre id="debugOut" style="display:none;background:var(--bg);border:1px solid var(--border);border-radius:0.5rem;padding:0.75rem;font-size:0.72rem;overflow-x:auto;white-space:pre-wrap;word-break:break-word;color:var(--text-mut);"></pre>
        <p class="faint" style="font-size:0.76rem;">La sincronización ahora descarga el fixture completo (las 30 fechas) directo del CSV público de TheSportsDB, con horas oficiales y resultados. Corre sola cada 6 horas si "Sync automático" está activo. La importación manual de abajo queda como respaldo.</p>
      </div>
    </details>

    <details class="card admin-sec">
      <summary>📥 Carga masiva de partidos</summary>
      <div class="admin-body">
        <p class="faint" style="font-size:0.82rem;">Un partido por línea, con este formato (hora de Chile):<br>
          <code style="color:var(--cobre);">fecha# | AAAA-MM-DD HH:MM | Local | Visita</code><br>
          Ejemplo:<br>
          <code style="color:var(--text-mut);">3 | 2026-03-07 20:00 | Colo-Colo | Universidad de Chile</code></p>
        <textarea id="bulkText" rows="8" placeholder="3 | 2026-03-07 20:00 | Colo-Colo | Universidad de Chile&#10;3 | 2026-03-08 18:00 | Cobresal | Huachipato" style="width:100%;font-family:ui-monospace,monospace;font-size:0.82rem;padding:0.6rem;background:var(--bg);border:1px solid var(--border);border-radius:0.5rem;color:var(--text);"></textarea>
        <div class="row">
          <button class="btn primary" id="bulkSubmit">Cargar partidos</button>
          <span class="faint" style="font-size:0.78rem;">Se pueden re-cargar para actualizar hora/equipos (mismo fecha+equipos = mismo partido).</span>
        </div>
      </div>
    </details>

    <details class="card admin-sec">
      <summary>➕ Agregar partido manual</summary>
      <div class="admin-body"><div class="row">
        <input id="addRound" type="number" placeholder="Fecha #" style="width:5.5rem;">
        <input id="addKick" type="datetime-local" style="width:13rem;">
        <input id="addHome" placeholder="Local" style="width:11rem;">
        <input id="addAway" placeholder="Visita" style="width:11rem;">
        <button class="btn primary" id="addFx">Agregar</button>
      </div></div>
    </details>

    <details class="card admin-sec">
      <summary>✏️ Editar partido / cargar resultado</summary>
      <div class="admin-body">
        <select id="edSel" style="max-width:100%;">${fxOptions||'<option>No hay partidos</option>'}</select>
        <div class="row">
          <input id="edRound" type="number" placeholder="Fecha #" style="width:5.5rem;">
          <input id="edKick" type="datetime-local" style="width:13rem;">
          <select id="edStatus" style="width:9rem;">
            <option value="scheduled">Programado</option>
            <option value="postponed">Suspendido</option>
          </select>
          <button class="btn" id="edSave">Guardar cambios</button>
        </div>
        <div class="row">
          <span class="muted" style="font-size:0.85rem;">Resultado:</span>
          <input id="edHS" type="number" min="0" placeholder="L" style="width:3.4rem;">
          <span>–</span>
          <input id="edAS" type="number" min="0" placeholder="V" style="width:3.4rem;">
          <button class="btn primary" id="edResult">Guardar resultado</button>
          <button class="btn" id="edClear">Borrar resultado</button>
          <button class="btn" id="edDelete" style="border-color:var(--mal);color:var(--mal);">Eliminar partido</button>
        </div>
      </div>
    </details>

    <details class="card admin-sec">
      <summary>👥 Usuarios</summary>
      <div class="admin-body">
        ${S.users.map(u=>`
          <div class="row" style="justify-content:space-between;border-bottom:1px solid var(--border);padding-bottom:0.4rem;">
            <span>${esc(u.name)} ${u.isAdmin?'<span class="faint">(admin)</span>':''} ${u.baseline?`<span class="faint" style="font-size:0.75rem;">base +${u.baseline}</span>`:''}</span>
            <span class="row">
              <button class="btn small resetUser" data-name="${esc(u.name)}">Nuevo código recuperación</button>
              ${u.name!==S.name?`<button class="btn small delUser" data-name="${esc(u.name)}" style="border-color:var(--mal);color:var(--mal);">Eliminar</button>`:''}
            </span>
          </div>`).join('')}
        <p class="faint" style="font-size:0.76rem;">“Nuevo código” genera un código de recuperación para que el usuario restablezca su contraseña desde “Olvidé mi contraseña”.</p>
      </div>
    </details>`;
}
function bindAdmin(){
  const adminFx = S.adminFixtures || S.fixtures;
  $('#saveScoring').onclick = async () => {
    try{
      await api('PUT','/api/admin/settings',{
        pts_exact: $('#setExact').value,
        pts_correct: $('#setCorrect').value,
        pts_miss: $('#setMiss').value,
        pts_fecha: $('#setFecha').value,
      });
      toast('Puntaje guardado');
    }catch(e){ toast(e.message); }
  };
  $('#saveStart').onclick = async () => {
    try{
      const v = $('#setStart').value;
      await api('PUT','/api/admin/settings',{ polla_start: v ? new Date(v).toISOString() : '' });
      toast('Fecha de inicio guardada');
    }catch(e){ toast(e.message); }
  };
  if($('#clearStart')) $('#clearStart').onclick = async () => {
    try{ await api('PUT','/api/admin/settings',{ polla_start: '' }); toast('Se incluye toda la temporada'); }
    catch(e){ toast(e.message); }
  };
  $('#csvSubmit').onclick = async () => {
    const text = $('#csvText').value;
    if(!text.trim()) return toast('Pega el CSV primero');
    $('#csvSubmit').disabled = true;
    try{
      const r = await api('POST','/api/admin/import-csv',{ text });
      let msg = `${r.added} partidos importados`;
      if(r.errors?.length) msg += ` · ${r.errors.length} con error`;
      toast(msg);
      if(r.errors?.length) alert('Errores:\n'+r.errors.slice(0,20).join('\n'));
    }catch(e){ toast(e.message); }
    $('#csvSubmit').disabled = false;
  };
  $('#bulkSubmit').onclick = async () => {
    const text = $('#bulkText').value;
    if(!text.trim()) return toast('Pega al menos un partido');
    $('#bulkSubmit').disabled = true;
    try{
      const r = await api('POST','/api/admin/bulk-fixtures',{ text });
      let msg = `${r.added} partidos cargados`;
      if(r.errors?.length) msg += ` · ${r.errors.length} con error`;
      toast(msg);
      if(r.errors?.length) alert('Errores:\n'+r.errors.join('\n'));
    }catch(e){ toast(e.message); }
    $('#bulkSubmit').disabled = false;
  };
  $('#saveSettings').onclick = async () => {
    try{
      await api('PUT','/api/admin/settings',{
        tsdb_league_id: $('#setLeague').value.trim(),
        tsdb_season: $('#setSeason').value.trim(),
        espn_slug: $('#setEspn').value.trim(),
        sync_enabled: $('#setSyncOn').checked ? 'true':'false',
      });
      toast('Configuración guardada');
    }catch(e){ toast(e.message); }
  };
  $('#syncNow').onclick = async () => {
    $('#syncNow').disabled = true;
    try{
      const r = await api('POST','/api/admin/sync');
      toast(r.ok ? `Sync OK — ${r.count} partidos` : `Sync falló: ${r.error}`);
    }catch(e){ toast(e.message); }
    $('#syncNow').disabled = false;
  };
  $('#debugBtn').onclick = async () => {
    const out = $('#debugOut');
    out.style.display = 'block';
    out.textContent = 'Cargando…';
    try{
      const r = await api('GET','/api/admin/debug');
      out.textContent = JSON.stringify(r, null, 2);
    }catch(e){ out.textContent = 'Error: '+e.message; }
  };
  $('#addFx').onclick = async () => {
    try{
      await api('POST','/api/admin/fixtures',{
        round: $('#addRound').value || null,
        kickoff: $('#addKick').value,
        home: $('#addHome').value, away: $('#addAway').value,
      });
      toast('Partido agregado');
    }catch(e){ toast(e.message); }
  };
  const edSel = $('#edSel');
  const fillEd = () => {
    const fx = adminFx.find(f=>f.id===edSel.value);
    if(!fx) return;
    $('#edRound').value = fx.round ?? '';
    $('#edKick').value = fx.kickoff ? new Date(new Date(fx.kickoff).getTime()-new Date().getTimezoneOffset()*60000).toISOString().slice(0,16) : '';
    $('#edStatus').value = fx.status==='postponed'?'postponed':'scheduled';
    $('#edHS').value = fx.home_score ?? '';
    $('#edAS').value = fx.away_score ?? '';
  };
  if(edSel && adminFx.length){ fillEd(); edSel.onchange = fillEd; }
  $('#edSave').onclick = async () => {
    try{
      await api('PUT',`/api/admin/fixtures/${encodeURIComponent(edSel.value)}`,{
        round: $('#edRound').value, kickoff: $('#edKick').value || undefined,
        status: $('#edStatus').value,
      });
      toast('Partido actualizado');
    }catch(e){ toast(e.message); }
  };
  $('#edResult').onclick = async () => {
    try{
      await api('PUT',`/api/admin/results/${encodeURIComponent(edSel.value)}`,{
        homeScore: $('#edHS').value, awayScore: $('#edAS').value,
      });
      toast('Resultado guardado');
    }catch(e){ toast(e.message); }
  };
  $('#edClear').onclick = async () => {
    try{ await api('PUT',`/api/admin/results/${encodeURIComponent(edSel.value)}`,{}); toast('Resultado borrado'); }
    catch(e){ toast(e.message); }
  };
  $('#edDelete').onclick = async () => {
    if(!confirm('¿Eliminar este partido y todos sus pronósticos?')) return;
    try{ await api('DELETE',`/api/admin/fixtures/${encodeURIComponent(edSel.value)}`); toast('Partido eliminado'); }
    catch(e){ toast(e.message); }
  };
  document.querySelectorAll('.resetUser').forEach(b=>b.onclick=async()=>{
    try{
      const r = await api('POST',`/api/admin/reset-user/${encodeURIComponent(b.dataset.name)}`);
      prompt(`Código de recuperación para ${r.name} (cópialo y envíaselo):`, r.recoveryCode);
    }catch(e){ toast(e.message); }
  });
  document.querySelectorAll('.delUser').forEach(b=>b.onclick=async()=>{
    if(!confirm(`¿Eliminar a ${b.dataset.name} y todos sus pronósticos?`)) return;
    try{ await api('DELETE',`/api/admin/users/${encodeURIComponent(b.dataset.name)}`); toast('Usuario eliminado'); }
    catch(e){ toast(e.message); }
  });
}

// ── Kickoff lock timer: re-render when a game crosses kickoff ─
setInterval(() => {
  if(!S.token || !S.fixtures.length) return;
  const now = Date.now();
  const crossing = S.fixtures.some(f => {
    if(!f.kickoff) return false;
    const k = new Date(f.kickoff).getTime();
    return k <= now && k > now - 31*1000;
  });
  if(crossing) render();
}, 30*1000);

// ── Boot ─────────────────────────────────────────────────────
if(S.token) connectWS();
render();
</script>
